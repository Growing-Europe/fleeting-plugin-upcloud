# Example GitLab Runner configuration using fleeting-plugin-upcloud.
#
# Copy this file to config.toml and fill in your own values.
# DO NOT commit config.toml — it is git-ignored because it references your runner token, and your
# UpCloud API token is supplied via the environment (not this file).

concurrent = 10
check_interval = 0

[[runners]]
  name = "upcloud-autoscaler"
  url = "https://gitlab.example.com"
  token = "GITLAB_RUNNER_AUTH_TOKEN"     # your GitLab Runner authentication token
  executor = "docker-autoscaler"

  [runners.docker]
    image = "alpine:latest"

  [runners.autoscaler]
    plugin = "fleeting-plugin-upcloud"
    max_use_count = 1                    # one job per VM, then destroy (ephemeral isolation)
    capacity_per_instance = 1
    max_instances = 10

    # UpCloud-specific settings.
    # The UpCloud API token is read from the environment (e.g. UPCLOUD_TOKEN), NOT placed here.
    [runners.autoscaler.plugin_config]
      zone            = "de-fra1"                  # UpCloud zone
      plan            = "2xCPU-4GB"                # UpCloud server plan
      template        = "REPLACE_WITH_TEMPLATE_UUID"
      # Networking — configure at least one reachable path to the runner VMs.
      network         = ""                         # SDN/private network UUID to attach (preferred dial target)
      utility_network = false                      # attach the zone's utility (SDN-backed private) network
      public_ipv4     = false                      # assign a public IPv4 (use when there is no private/SDN reachability)
      public_ipv6     = false                      # assign a public IPv6
      hostname_prefix = "fleeting"
      storage_size_gb = 25

    [runners.autoscaler.connector_config]
      username = "root"
      use_static_credentials = false

    [[runners.autoscaler.policy]]
      idle_count = 1                               # small warm pool
      idle_time  = "20m0s"
