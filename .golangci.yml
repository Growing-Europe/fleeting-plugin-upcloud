# golangci-lint configuration for fleeting-plugin-upcloud.
# Kept deliberately strict — this plugin holds credentials and provisions billable
# cloud resources, so correctness and resource-leak linters matter.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck      # unchecked errors (a dropped delete error = a lingering bill)
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - bodyclose     # unclosed HTTP response bodies
    - unconvert
    - unparam
    - prealloc
    - nilerr
    - errorlint

linters-settings:
  goimports:
    local-prefixes: github.com/Growing-Europe/fleeting-plugin-upcloud
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files may use dot-imports and longer functions.
    - path: _test\.go
      linters:
        - unparam
