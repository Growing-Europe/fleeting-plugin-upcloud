name: Bug report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not include secrets** (UpCloud API tokens,
        runner config). Redact identifiers before pasting logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the plugin with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Tag or commit SHA (and GitLab Runner version).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted logs or error output.
      render: shell
    validations:
      required: false
