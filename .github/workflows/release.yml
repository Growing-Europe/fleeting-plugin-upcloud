name: Release

on:
  push:
    tags: ['v*']

# Default to read-only; jobs opt in to what they need.
permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser (build, sign, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release and upload assets
      id-token: write   # keyless cosign signing via OIDC
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: 'stable'
          check-latest: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute artifact hashes for provenance
        id: hash
        run: |
          set -euo pipefail
          # base64-encode the sha256 of every archive + checksums file as SLSA subjects
          files="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'checksums.txt' \) | sort)"
          hashes="$(sha256sum $files | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: [goreleaser]
    permissions:
      actions: read     # read the workflow run for provenance
      id-token: write   # mint the provenance signing certificate
      contents: write   # attach provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
