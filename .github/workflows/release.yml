name: Release

on:
  push:
    tags: ['v*']

# Default to read-only; jobs opt in to what they need.
permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser (build, sign, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release and upload assets
      id-token: write   # keyless cosign signing via OIDC
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          check-latest: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign BINARY (not just the action) so CI uses the exact
          # version the signs: block was validated against — sign-blob --bundle
          # producing the new Sigstore format is the default in v3.0.6. Without
          # this, an action-default bump could silently change cosign behavior.
          cosign-release: 'v3.0.6'
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute artifact hashes for provenance
        id: hash
        run: |
          set -euo pipefail
          # base64-encode the sha256 of every archive + checksums file as SLSA subjects
          files="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'checksums.txt' \) | sort)"
          hashes="$(sha256sum $files | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: [goreleaser]
    permissions:
      actions: read     # read the workflow run for provenance
      id-token: write   # mint the provenance signing certificate
      contents: write   # attach provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
